name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  validate-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify README content
        run: |
          test -f README.md
          grep -F "A simple Express.js API server for testing Agent Orchestrator workflows." README.md
          grep -F "## Usage" README.md
          grep -F '`npm start`' README.md
